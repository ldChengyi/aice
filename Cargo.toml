[package]
name = "aice"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
axum = "0.8"
leptos = { version = "0.8", default-features = false, features = ["ssr"] }
qqbot-sdk-rs = "0.2"
rig-core = { version = "0.46", features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }

upstream aice_web {
    zone aice_web 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server aice:3210 resolve;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = / {
        return 302 /personas;
    }

    location = /personas {
        limit_except GET {
            deny all;
        }
        proxy_pass http://aice_web/personas;
    }

    location = /assets/personas.css {
        limit_except GET {
            deny all;
        }
        proxy_pass http://aice_web/assets/personas.css;
    }

    location / {
        return 404;
    }
}

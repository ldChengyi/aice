upstream aice_web {
    zone aice_web 64k;
    resolver 127.0.0.11 valid=5s ipv6=off;
    server aice:3210 resolve;
}

server {
    listen 80;
    server_name _;
    absolute_redirect off;

    location = / {
        return 302 /ui/personas;
    }

    location = /personas {
        return 302 /ui/personas;
    }

    location = /assets/personas.css {
        return 302 /ui/assets/personas.css;
    }

    location = /ui {
        return 302 /ui/personas;
    }

    location = /ui/ {
        return 302 /ui/personas;
    }

    location /ui/ {
        proxy_pass http://aice_web/ui/;
    }

    location / {
        return 404;
    }
}
